server {
    listen 80;
    server_name localhost;
    client_max_body_size 0;  # ponytail: sin límite — imports de vault pueden ser grandes

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;  # v1.5.9: chat LOCAL en CPU tarda 6-8 min — 300s lo cortaba
        proxy_connect_timeout 300s;
        proxy_send_timeout 900s;
    }

    location /vault-static/ {
        proxy_pass http://backend:8000/vault-static/;
        proxy_set_header Host $host;
    }

    location /agent/ {
        proxy_pass http://sistema-agente:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }


    location /ollama-api/ {
        proxy_pass http://ollama:11434/;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /ollama-ws/ {
        proxy_pass http://backend:8000/ollama-ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}