name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # ponytail: el test es assert puro (stdlib), no necesita requirements
      - run: python tests/test_combo_routing.py
