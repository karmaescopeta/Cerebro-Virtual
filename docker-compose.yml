services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - VAULT_PATH=/app/vault
      - VAULT_HOST_PATH=${VAULT_HOST_PATH:-}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-cerebrovirtual}
      - GITHUB_REPO=${GITHUB_REPO:-}
    volumes:
      - ./vault:/app/vault
      - ./sistema-agente:/app/sistema-agente:ro
      - ./herramientas:/app/herramientas:ro
      - ./VERSION:/app/VERSION:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cerebro-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - cerebro-network
    depends_on:
      - backend

  sistema-agente:
    build:
      context: ./sistema-agente
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-8080}:8080"
    volumes:
      - ./vault:/app/vault
      - ./sistema-agente/config:/app/config
    networks:
      - cerebro-network
    depends_on:
      - backend
    environment:
      - VAULT_PATH=/app/vault
      - CONFIG_PATH=/app/config/agent-config.yaml
      - HERMES_CONFIG=/app/vault/system/agent-config.json

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:${SEARXNG_PORT:-8888}/
    networks:
      - cerebro-network

  herramientas:
    build:
      context: ./herramientas
      dockerfile: Dockerfile
    restart: "no"
    volumes:
      - ./vault:/app/vault
    environment:
      - OPENAI_BASE_URL=https://openrouter.ai/api/v1
      - OPENAI_API_KEY=${OPENROUTER_API_KEY}
      - GRAPHIFY_OPENAI_MODEL=google/gemma-4-26b-a4b-it:free
    networks:
      - cerebro-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    networks:
      - cerebro-network
    depends_on:
      - frontend
    profiles:
      - tunnel

networks:
  cerebro-network:
    driver: bridge