services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - VAULT_PATH=/app/vault
      - VAULT_HOST_PATH=${VAULT_HOST_PATH:-}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-cerebrovirtual}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - OMNIROUTE_MANAGE_PASSWORD=${OMNIROUTE_MANAGE_PASSWORD:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - ${VAULT_DIR:-./vault}:/app/vault
      - ${AGENT_CONFIG_DIR:-./sistema-agente/config}:/app/sistema-agente/config:ro
      - ./herramientas:/app/herramientas:ro
      - ./VERSION:/app/VERSION:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ${ENV_FILE:-./.env}:/app/.env:rw
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cerebro-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - cerebro-network
    depends_on:
      - backend

  sistema-agente:
    build:
      context: ./sistema-agente
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-8080}:8080"
    volumes:
      - ${VAULT_DIR:-./vault}:/app/vault
      - ${AGENT_CONFIG_DIR:-./sistema-agente/config}:/app/config
    networks:
      - cerebro-network
    depends_on:
      - backend
    environment:
      - VAULT_PATH=/app/vault
      - CONFIG_PATH=/app/config/agent-config.yaml
      - HERMES_CONFIG=/app/vault/system/agent-config.json
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-omniroute}

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:${SEARXNG_PORT:-8888}/
    networks:
      - cerebro-network

  herramientas:
    build:
      context: ./herramientas
      dockerfile: Dockerfile
    restart: "no"
    volumes:
      - ${VAULT_DIR:-./vault}:/app/vault
    environment:
      - OPENAI_BASE_URL=http://omniroute:20128/v1
      - OPENAI_API_KEY=${OMNIROUTE_API_KEY:-omniroute}
      - GRAPHIFY_OPENAI_MODEL=google/gemma-4-26b-a4b-it:free
    networks:
      - cerebro-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    networks:
      - cerebro-network
    depends_on:
      - frontend
    profiles:
      - tunnel

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # v1.5.8: sin esto Ollama sirve con ctx 4096 por defecto — el prompt del sistema de
    # Hermes llega a ~11-12k tokens y el chat LOCAL muere con "exceeds context size".
    # Los modelos recortan solos a su máximo si soportan menos.
    environment:
      - OLLAMA_CONTEXT_LENGTH=32768
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - cerebro-network

  omniroute:
    image: diegosouzapw/omniroute:latest
    restart: unless-stopped
    ports:
      - "${OMNIROUTE_PORT:-20128}:20128"
    environment:
      - PORT=20128
      - DATA_DIR=/app/data
      - INITIAL_PASSWORD=${OMNIROUTE_MANAGE_PASSWORD:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - omniroute-data:/app/data
    networks:
      - cerebro-network
    # ponytail: sin puerto host — dashboard vía nginx /omniroute/, API vía red interna
    depends_on:
      - ollama

networks:
  cerebro-network:
    driver: bridge

volumes:
  ollama-models:
  omniroute-data: