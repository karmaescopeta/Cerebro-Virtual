<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Cerebros</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
:root {
  /* Tokens de la web (tokens.css test4) — tema claro por defecto */
  --color-bg: #FAF8F4; --color-surface: #FFFFFF; --color-surface-container: #F2EEE7;
  --color-surface-high: #E9E4DB; --color-surface-highest: #DCD5C9;
  --color-border: #D8D2C6; --color-border-variant: #A8A093;
  --color-text-primary: #201D18; --color-text-secondary: #524D44; --color-text-tertiary: #6E6759;
  --color-primary: #1E6E52; --color-primary-container: #1E6E52; --color-on-primary: #FFFFFF;
  --color-primary-glow: rgba(30, 110, 82, 0.22);
  --color-success: #178253; --color-error: #B33A25; --color-error-container: #7A1F10;
  --shadow-card: 0 4px 16px -4px rgba(32, 29, 24, 0.12);
  --shadow-glow: 0 2px 8px rgba(32, 29, 24, 0.08);
  --font-display: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --radius-md: 16px; --radius-lg: 22px; --radius-full: 9999px;
  --transition-fast: 0.18s ease;
}
[data-theme="dark"] {
  /* Oscuro: mismo tema que fuerza el wizard */
  --color-bg: #070912; --color-surface: #0D101D; --color-surface-container: #121626;
  --color-surface-high: #1A1F33; --color-surface-highest: #232A44;
  --color-border: #2A3350; --color-border-variant: #475069;
  --color-text-primary: #EDF0F8; --color-text-secondary: #A9B1C6; --color-text-tertiary: #7C86A6;
  --color-primary: #38BDF8; --color-primary-container: #60A5FA; --color-on-primary: #082F49;
  --color-primary-glow: rgba(56, 189, 248, 0.3);
  --color-success: #34D399; --color-error: #F87171; --color-error-container: #7F1D1D;
  --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 24px rgba(56, 189, 248, 0.15);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: var(--font-body); background: radial-gradient(circle at 50% 0%, var(--color-surface-container) 0%, var(--color-bg) 70%); background-attachment: fixed; color: var(--color-text-primary); min-height:100vh; padding:32px; }
h1 { font-family: var(--font-display); font-size:28px; font-weight:700; } h2 { font-size:20px; font-weight:600; margin-bottom:16px; }
.material-symbols-outlined { font-family: 'Material Symbols Rounded'; font-feature-settings: 'liga'; -webkit-font-feature-settings: 'liga'; }
.subtitle { color: var(--color-text-tertiary); font-size:14px; margin-top:4px; }
.card { background: var(--color-surface); border:1px solid var(--color-border); border-radius: var(--radius-lg); padding:24px; box-shadow: var(--shadow-card); margin-bottom:24px; }
.btn { display:inline-flex; align-items:center; gap:8px; padding:10px 20px; border-radius: var(--radius-full); font-size:14px; font-weight:600; border:none; cursor:pointer; transition: var(--transition-fast); }
.btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
.btn-primary:hover { box-shadow: var(--shadow-glow); }
.btn-secondary { background: var(--color-surface-high); color: var(--color-text-primary); border:1px solid var(--color-border); }
.btn-secondary:hover { background: var(--color-surface-highest); }
.btn-danger { background: var(--color-error-container); color: var(--color-error); border:1px solid var(--color-error); }
.btn-danger:hover { opacity:0.85; }
.btn:disabled { opacity:0.5; filter:grayscale(75%); cursor:not-allowed; }  /* v1.5 (D): gris evidente — azul al 50% parecía pulsable */
.btn .material-symbols-outlined { font-size:18px; }
.input { width:100%; padding:10px 14px; background: var(--color-surface-container); border:1px solid var(--color-border); border-radius: var(--radius-md); color: var(--color-text-primary); font-size:14px; outline:none; transition: var(--transition-fast); }
.input:focus { border-color: var(--color-primary); }
table { width:100%; border-collapse:collapse; }
th,td { text-align:left; padding:12px 16px; border-bottom:1px solid var(--color-border); }
th { color: var(--color-text-tertiary); font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.5px; }
td { font-size:14px; }
.mono-cell { font-family: var(--font-mono); font-size:12px; color: var(--color-text-secondary); white-space:nowrap; }
.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius: var(--radius-full); font-size:12px; font-weight:500; }
.badge .material-symbols-outlined { font-size:14px; }
.badge-running { background:color-mix(in srgb, var(--color-success) 15%, transparent); color: var(--color-success); }
.badge-stopped { background: var(--color-surface-high); color: var(--color-text-tertiary); }
.badge-ok { background:color-mix(in srgb, var(--color-success) 15%, transparent); color: var(--color-success); }
.badge-fail { background:color-mix(in srgb, var(--color-error) 15%, transparent); color: var(--color-error); }
.header { display:flex; justify-content:flex-end; align-items:center; position:relative; margin-bottom:32px; min-height:48px; }
.header h1 { position:absolute; left:50%; transform:translateX(-50%); margin:0; white-space:nowrap; }
.req-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:var(--space-5); }
.label-caps { font-family: var(--font-mono); font-size:10.5px; font-weight:500; letter-spacing:.14em; color: var(--color-text-tertiary); text-transform:uppercase; }
.req-item { background:color-mix(in srgb, var(--color-text-primary) 4%, transparent); border:1px solid var(--color-border); border-radius: var(--radius-md); padding:18px 20px; display:flex; flex-direction:column; gap:10px; }
.req-item .material-symbols-outlined { font-size:20px; color: var(--color-primary); }
.req-top { display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
.req-version { font-family: var(--font-mono); font-size:12px; color: var(--color-text-tertiary); }
.req-foot { display:flex; align-items:center; gap:10px; margin-top:auto; flex-wrap:wrap; }
.req-link { display:inline-flex; align-items:center; gap:4px; font-size:12px; color: var(--color-primary); text-decoration:none; }
.req-link .material-symbols-outlined { font-size:14px; }
.req-link:hover { text-decoration:underline; }
.modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:1000; }
.modal { background: var(--color-surface); border-radius: var(--radius-lg); padding:32px; max-width:500px; width:90%; box-shadow: var(--shadow-card); }
.modal h2 { margin-bottom:20px; } .modal-actions { display:flex; gap:12px; justify-content:flex-end; margin-top:24px; }
.toast { position:fixed; bottom:24px; right:24px; padding:12px 20px; border-radius: var(--radius-md); font-size:14px; font-weight:500; z-index:2000; animation:slideIn 0.3s ease; }
@keyframes slideIn { from{transform:translateX(100%);opacity:0;} to{transform:translateX(0);opacity:1;} }
.loading-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:3000; }
.loading-box { text-align:center; }
.loading-box p { margin-top:16px; color: var(--color-text-secondary); }
.spinner { width:20px; height:20px; border:2px solid var(--color-surface-high); border-top:2px solid var(--color-primary); border-radius:50%; animation:spin 0.8s linear infinite; display:inline-block; }
@keyframes spin { to{transform:rotate(360deg);} }
.empty-state { text-align:center; padding:40px; color: var(--color-text-tertiary); }
.empty-state .material-symbols-outlined { font-size:48px; opacity:0.3; margin-bottom:16px; }
.actions-cell { display:flex; gap:8px; justify-content:flex-end; }
th:last-child { text-align:right; }
.btn-sm { padding:6px 14px; font-size:12px; font-weight:500; }
.btn-sm .material-symbols-outlined { font-size:16px; }
.icon-info { background:color-mix(in srgb, var(--color-primary) 12%, transparent); color: var(--color-primary); border:1px solid color-mix(in srgb, var(--color-primary) 35%, transparent); padding:4px 7px; cursor:pointer; border-radius:var(--radius-full); display:inline-flex; align-items:center; }
.icon-info:hover { background:color-mix(in srgb, var(--color-primary) 22%, transparent); }
.icon-info .material-symbols-outlined { font-size:16px; }
.btn-icon { padding:6px 9px; }
.btn-icon-danger { background:color-mix(in srgb, var(--color-error) 12%, transparent); color: var(--color-error); border:1px solid color-mix(in srgb, var(--color-error) 35%, transparent); }
th { font-family: var(--font-mono); }
.log-panel { background: var(--color-bg); border:1px solid var(--color-border); border-radius: var(--radius-md); padding:16px; font-family: var(--font-mono); font-size:12px; max-height:240px; overflow-y:auto; white-space:pre-wrap; }
.toast-success { background:color-mix(in srgb, var(--color-success) 15%, transparent); color: var(--color-success); border:1px solid var(--color-success); }
.toast-error { background:color-mix(in srgb, var(--color-error) 15%, transparent); color: var(--color-error); border:1px solid var(--color-error); }
.brow-row { display:flex; align-items:center; gap:10px; padding:8px 12px; font-size:13px; color: var(--color-text-primary); cursor:pointer; border-bottom:1px solid var(--color-border); }
.brow-row:last-child { border-bottom:none; }
.brow-row:hover { background: var(--color-surface-high); }
.brow-row .material-symbols-outlined { font-size:18px; color: var(--color-primary); }
/* v1.5: filas de Ajustes — icono en círculo tintado + textos + acción alineada */
.set-row { display:flex; gap:16px; align-items:center; padding:16px 0; border-bottom:1px solid var(--color-border); }
.set-row:last-child { border-bottom:none; padding-bottom:4px; }
.set-ico { width:42px; height:42px; flex-shrink:0; border-radius:var(--radius-full); display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--color-primary) 12%, transparent); color: var(--color-primary); }
.set-ico .material-symbols-outlined { font-size:21px; }
.set-txt { flex:1; min-width:0; }
.set-title { font-weight:600; font-size:14px; margin-bottom:3px; }
.set-desc { font-size:12.5px; color:var(--color-text-tertiary); line-height:1.5; }
.set-path { font-family:var(--font-mono); font-size:11.5px; color:var(--color-text-secondary); word-break:break-all; background:var(--color-surface-container); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:6px 10px; margin-bottom:18px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
function toast(msg, type='success', ms) {
  // v1.5 (U8): un solo toast a la vez (el nuevo sustituye al viejo), errores 8s o hasta clic, announce a lectores
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div'); el.className = `toast toast-${type}`; el.textContent = msg;
  el.setAttribute('role', 'alert'); el.style.cursor = 'pointer';
  el.onclick = () => el.remove();
  document.body.appendChild(el); setTimeout(() => el.remove(), ms || (type === 'error' ? 8000 : 3000));
}
async function api(path, opts={}) {
  const t = opts.__timeout || 120000; delete opts.__timeout;  // __timeout: ms de espera (selector nativo necesita mucho)
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), t);
  try { const res = await fetch(path, {...opts, signal: ctrl.signal}); clearTimeout(timer); return await res.json(); }
  catch(e) { clearTimeout(timer); return {error: e.name === 'AbortError' ? 'Timeout' : e.message}; }
}
function showLoading(text) {
  const el = document.createElement('div'); el.className = 'loading-overlay'; el.id = 'loading';
  el.innerHTML = `<div class="loading-box"><div class="spinner"></div><p>${text}</p></div>`;
  document.body.appendChild(el);
}
function hideLoading() { const el = document.getElementById('loading'); if (el) el.remove(); }

const REQ_ICONS = {"Docker":"hub","Docker corriendo":"sync","Git":"terminal","Python":"science","RAM (8GB)":"memory","Espacio disco (5GB)":"save","Espacio (1GB)":"save","Imágenes base":"cloud_upload"};
const reqCards = list => list.map(c => `<div class="req-item"><div class="req-top"><span class="material-symbols-outlined">${REQ_ICONS[c.name]||'info'}</span><span>${c.name}</span></div><div class="req-version">${c.version||(c.ok?'OK':'No encontrado')}</div><div class="req-foot">${c.info?'<span class="badge badge-stopped"><span class="material-symbols-outlined">info</span>Se descargan solas</span>':(c.ok?'<span class="badge badge-ok"><span class="material-symbols-outlined">check_circle</span>OK</span>':`<span class="badge badge-fail"><span class="material-symbols-outlined">warning</span>Faltante</span>${c.url?`<a class="req-link" href="${c.url}" target="_blank" rel="noreferrer"><span class="material-symbols-outlined">download</span>Descargar</a>`:''}`)}</div></div>`).join('');
async function render() {
  const req = await api('/api/requirements');
  const inst = await api('/api/instances');
  const general = req.general || [], porCerebro = req.por_cerebro || [];
  const faltan = general.concat(porCerebro).filter(c => !c.ok && !c.info).length;
  const dockerOk = (general.find(c => c.name === 'Docker corriendo') || {}).ok;
  const dockerInst = (general.find(c => c.name === 'Docker') || {}).ok;
  const nInst = general.filter(c => ['Docker','Git','Python'].includes(c.name) && !c.ok).length;
  const chip = dockerOk && faltan === 0 ? '<span class="badge badge-ok"><span class="material-symbols-outlined">check_circle</span>Todo listo</span>' : `<span class="badge badge-fail"><span class="material-symbols-outlined">warning</span>Faltan ${faltan}</span>`;
  const imBase = porCerebro.find(c => c.name === 'Imágenes base');
  if (imBase) window.__imgBaseOk = imBase.ok;
  window.__isWin = req.is_win !== false;
  window.__base = req.base || '';
  const projReady = req.project_ready !== false;
  window.__projReady = projReady;

  window.__ddHere = req.docker_data_here !== false;  // v1.5: ¿los datos de Docker ya viven junto al sistema?
  // v1.5 (U4): el hueco del botón muestra SIEMPRE el siguiente paso — nunca un botón gris sin explicación
  let nbBtn;
  if (dockerOk && projReady) {
    nbBtn = `<button class="btn btn-primary" onclick="showCreateModal()"><span class="material-symbols-outlined">add</span> Nuevo cerebro</button>`;
  } else if (!dockerOk && projReady && dockerInst) {
    nbBtn = `<button class="btn btn-primary" onclick="startDockerBtn(this)"><span class="material-symbols-outlined">sync</span>Arrancar Docker</button>`;
  } else if (!projReady) {
    nbBtn = `<span class="subtitle" style="align-self:center;text-align:right;">Termina de instalar el sistema (arriba) para crear cerebros</span>`;
  } else {
    nbBtn = `<span class="subtitle" style="align-self:center;text-align:right;">Instala y arranca Docker (requisitos de abajo) para crear cerebros</span>`;
  }
  // v1.5: la tuerca — los ajustes del sistema viven aquí, no sueltos por la página
  const gear = projReady ? `<button class="btn btn-secondary btn-icon" aria-label="Ajustes" title="Ajustes" style="margin-left:10px;" onclick="showSettings()"><span class="material-symbols-outlined">settings</span></button>` : '';
  document.getElementById('app').innerHTML = `
    <div class="header">
      <h1>Cerebro Virtual</h1>
      ${nbBtn}${gear}
    </div>
    ${req.gestor_update ? `<div class="card" style="padding:16px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-color:var(--color-primary);">
      <span class="material-symbols-outlined" style="color:var(--color-primary);">update</span>
      <span style="flex:1;min-width:200px;">Hay una versión nueva del Gestor de Cerebros (${req.gestor_update.latest}). Descárgala y sustituye tu exe.</span>
      <a class="req-link" href="${req.gestor_update.url}" target="_blank" rel="noreferrer" style="font-size:13px;"><span class="material-symbols-outlined">download</span>Descargar nueva versión</a>
    </div>` : ''}
    ${!projReady ? `<div class="card" style="border-color:var(--color-primary);">
      <h2>Instalar Cerebro Virtual</h2>
      <p class="subtitle" style="margin-bottom:16px;">Haz clic, elige la carpeta destino (puede ser otro disco duro) y el sistema queda instalado ahí en ~un minuto. Sistema, cerebros y vaults vivirán juntos en esa carpeta.</p>
      <button class="btn btn-primary" onclick="showLocationModal('instalar')"><span class="material-symbols-outlined">download</span>Instalar Cerebro Virtual</button>
    </div>` : ''}
    <div class="card">
      <h2 style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">Requisitos ${chip}${nInst ? '<button class="btn btn-secondary btn-sm" style="margin-left:auto;" onclick="installDeps()"><span class="material-symbols-outlined">download</span>Instalar dependencias</button>' : ''}</h2>
      ${dockerOk ? '' : '<p class="subtitle" style="margin-bottom:14px;">Arranca Docker Desktop y espera a que la ballena esté verde — la página se refresca sola cada 5 segundos.</p>'}
      <div class="req-grid">${reqCards(general)}</div>
      <p class="label-caps" style="margin:20px 0 12px;">Por cerebro</p>
      <div class="req-grid">${reqCards(porCerebro)}</div>
    </div>
    <div class="card">
      <h2 style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">Tus cerebros (${(inst.instances||[]).length}) ${projReady ? `<span class="req-version" style="font-weight:400;">— sistema en ${req.base}</span>` : ''}</h2>
      ${(inst.instances||[]).length ? `<table><thead><tr><th>Nombre</th><th>Estado</th><th>Recursos</th><th>Acciones</th></tr></thead><tbody>
        ${(inst.instances||[]).map(i => { const sizeVis = parseFloat(i.size_gb) > 0.1 ? i.size_gb : ''; const starting = startingSet.has(i.name); return `<tr><td style="font-weight:600;color:var(--color-primary);">${i.name}</td><td><span class="badge badge-${i.status==='running'?'running':'stopped'}">${i.status==='running'?'Activo':'Parado'}</span></td><td class="mono-cell">${[i.stats, sizeVis].filter(Boolean).join(' · ')||'—'}</td><td class="actions-cell">${starting ? `<button class="btn btn-primary btn-sm" disabled title="Arrancando…"><span class="material-symbols-outlined">sync</span>Arrancando…</button>` : i.status==='running' ? `<button class="btn btn-primary btn-sm" title="localhost:${i.ports.FRONTEND_PORT||5173}" onclick="openInst('${i.name}', ${i.ports.FRONTEND_PORT||5173})"><span class="material-symbols-outlined">public</span>Abrir</button><button class="btn btn-secondary btn-sm" onclick="stopInst('${i.name}')">Parar</button>` : `<button class="btn btn-primary btn-sm" ${dockerOk?'':'disabled title="Arranca Docker primero"'} onclick="startInst('${i.name}')"><span class="material-symbols-outlined">electric_bolt</span>Iniciar</button>`}<button class="btn btn-secondary btn-sm btn-icon" title="Descargar vault" onclick="downloadInst('${i.name}')"><span class="material-symbols-outlined">download</span></button><button class="btn btn-sm btn-icon btn-icon-danger" title="Borrar" onclick="removeInst('${i.name}','${i.status}')"><span class="material-symbols-outlined">delete</span></button></td></tr>`; }).join('')}
      </tbody></table>` : `<div class="empty-state"><span class="material-symbols-outlined">psychology</span><p>Aún no hay cerebros.</p><p style="margin-top:8px;font-size:13px;">Crea tu primer Cerebro con el botón de arriba.</p></div>`}
    </div>
  `;
  if (!projReady && !locAsked && !document.querySelector('.modal-overlay')) { locAsked = true; askNewOrExisting(); }
  if (projReady) maybeScan();
  if (projReady && req.sueltos && !tidyAsked && !document.querySelector('.modal-overlay')) {
    tidyAsked = true;
    const m = document.createElement('div'); m.className = 'modal-overlay';
    m.innerHTML = `<div class="modal"><h2>He encontrado archivos de un cerebro sin carpeta propia</h2><p class="subtitle" style="margin-bottom:16px;">Hay datos de un cerebro sueltos en la carpeta del sistema (sin su carpeta con el nombre). ¿Los organizo dentro de una carpeta con su nombre? Así aparecerá en tu lista de cerebros.</p><div class="modal-actions"><button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Déjalos como están</button><button class="btn btn-primary" id="tidygo">Organizar</button></div></div>`;
    document.body.appendChild(m);
    m.querySelector('#tidygo').onclick = async () => {
      m.remove();
      const d = await api('/api/tidy-root', {method:'POST'});
      if (d.error) { toast(d.error, 'error'); return; }
      toast(`Organizado en la carpeta "${d.name}"`); render();
    };
  }
}

function showCreateModal() {
  // v1.5 (U3): validación EN VIVO — motivo bajo el input, Crear deshabilitado hasta que sea válido
  const m = document.createElement('div'); m.className = 'modal-overlay';
  m.innerHTML = `<div class="modal"><h2>Crear nuevo cerebro</h2><p class="subtitle" style="margin-bottom:12px;">Elige un nombre: solo letras, números, guiones y guiones bajos (64 como mucho).</p><input class="input" id="new-name" placeholder="ej: cerebro2" autofocus><div id="name-err" style="min-height:20px;font-size:12px;color:var(--color-error);margin-top:6px;"></div><div class="modal-actions"><button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancelar</button><button class="btn btn-primary" id="create-btn" disabled>Crear</button></div></div>`;
  document.body.appendChild(m);
  const inp = m.querySelector('#new-name'), btn = m.querySelector('#create-btn'), err = m.querySelector('#name-err');
  const validate = () => {
    const name = inp.value.trim(); let e = '';
    if (name.length > 64) e = 'Demasiado largo — 64 caracteres como mucho';
    else if (name && !/^[A-Za-z0-9_-]+$/.test(name)) e = 'Sin espacios ni acentos — solo letras, números y guiones';
    err.textContent = e;
    btn.disabled = !name || !!e;
  };
  inp.oninput = validate;
  inp.onkeydown = e => { if (e.key === 'Enter' && !btn.disabled) btn.click(); };
  btn.onclick = async () => {
    const name = inp.value.trim();
    m.remove(); showLoading('Creando instancia...');
    const d = await api('/api/create', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
    hideLoading();
    // v1.5 (U12): el "Ya existe" explica QUÉ hacer

}

async function newFolder() {

const LOG_TITLES = {'task:setup':'Instalando Cerebro Virtual','task:deps':'Instalando dependencias','task:dockermove':'Liberando espacio del disco de Windows','task:move':'Moviendo tus cerebros','task:relocate':'Mudando todo el sistema'};
// v1.5 (U10/U17): panel de progreso con reloj SIEMPRE vivo + última línea visible.
// Vive en <body> (fuera de #app) — render() no lo destruye; al acabar queda con ✓ y botón Abrir.
function showLog(n) {
  logActive = true;
  document.getElementById('logbox')?.remove();
  const box = document.createElement('div'); box.className = 'card'; box.id = 'logbox';
  document.body.appendChild(box);
  box.innerHTML = `<h2 style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">${LOG_TITLES[n] || 'Iniciando ' + n}<span class="req-version" style="font-weight:400;" id="logclock">0:00</span><span class="icon-info" style="margin-left:auto;cursor:pointer;" title="Cerrar panel" onclick="this.closest('.card').remove()"><span class="material-symbols-outlined">close</span></span></h2>${n !== 'task:setup' && window.__imgBaseOk === false ? '<p class="subtitle" style="margin-bottom:12px;">Primera vez: se descargan las imágenes (~3GB) y puede tardar varios minutos. No cierres esta página.</p>' : ''}<div id="loglast" style="margin:0 0 6px;font-family:var(--font-mono);font-size:11px;color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Empezando…</div><div class="log-panel" id="loglines"></div><div id="logfoot"></div>`;
  const t0 = Date.now();
  const clock = setInterval(() => {
    const c = document.getElementById('logclock');
    if (!c) { clearInterval(clock); return; }
    const s = Math.floor((Date.now() - t0) / 1000);
    c.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} transcurridos`;
  }, 1000);
  const finish = async (d) => {
    clearInterval(clock);
    logActive = false;
    const foot = document.getElementById('logfoot');
    if (foot) {
      const badge = `<span class="badge ${d.ok ? 'badge-ok' : 'badge-fail'}"><span class="material-symbols-outlined">${d.ok ? 'check_circle' : 'warning'}</span>${d.ok ? 'Terminado' : 'Error'}</span>`;

        try {
          const inst = await api('/api/instances');
          const it = (inst.instances || []).find(i => i.name === n);
          const port = it && it.ports.FRONTEND_PORT;
          if (port) extra = `<button class="btn btn-primary btn-sm" onclick="window.open('http://localhost:${port}')"><span class="material-symbols-outlined">public</span>Abrir</button>`;
        } catch (e) {}
      }
      foot.innerHTML = `<div style="display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;">${badge}${extra}<button class="btn btn-secondary btn-sm" style="margin-left:auto;" onclick="this.closest('.card').remove()">Cerrar</button></div>`;
    }
    startingSet.delete(n);
  };
  const poll = async () => {
    const d = await api(`/api/logs/${encodeURIComponent(n)}`);
    const el = document.getElementById('loglines');
    if (!el) { logActive = false; clearInterval(clock); return; }
    const trad = (d.lines || []).map(l => l
      .replace(/^(\S*)\s*Pulling fs layer.*$/, '$1 descargando pieza…')
      .replace(/^(\S*)\s*Downloading\s+(\S+)$/, 'Descargando $2')
      .replace(/^(\S*)\s*Download complete.*$/, '$1 descarga completa')
      .replace(/^(\S*)\s*Pull complete.*$/, '$1 lista'));
    // v1.5 (M4): URLs clicables en el log — escapando todo lo que venga de docker/winget antes
    const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    el.innerHTML = trad.map(l => esc(l).replace(/(https?:\/\/\S+)/g, '<a href="$1" target="_blank" rel="noreferrer" style="color:var(--color-primary);text-decoration:underline;">$1</a>')).join('\n');
    el.scrollTop = el.scrollHeight;
    const last = document.getElementById('loglast');

    if (d.done) {
      await finish(d);
      if (n === 'task:setup') {
        toast(d.ok ? 'Sistema instalado — ya puedes crear cerebros' : 'Error al instalar el sistema', d.ok ? 'success' : 'error');

      else if (n === 'task:deps') toast(d.ok ? 'Dependencias listas' : 'Algunas dependencias fallaron — mira el log', d.ok ? 'success' : 'error');
      else if (n === 'task:dockermove') toast(d.ok ? 'Espacio liberado — lo que Docker descarga ahora vive con tus cerebros' : 'Error liberando espacio — mira el log', d.ok ? 'success' : 'error');
      else if (n === 'task:move' || n === 'task:relocate') {
        // v1.5.1: decir DÓNDE quedó todo — ruta fresca tras la mudanza
        if (d.ok) { try { const rr = await api('/api/requirements'); toast((n === 'task:move' ? 'Tus cerebros ahora viven en:\n' : 'Tu sistema ahora vive en:\n') + rr.base, 'success', 7000); } catch (e) { toast('Mudanza completada'); } }
        else toast('Error mudando — mira el log', 'error');
      }
      else d.ok ? toast(`${n} iniciado`) : toast(`Error al iniciar ${n}`, 'error');
      render();
      return;
    }
    setTimeout(poll, 1500);
  };
  poll();
}
async function stopInst(n) { showLoading(`Parando ${n} (los cerebros grandes tardan un poco)...`); const d = await api(`/api/stop/${encodeURIComponent(n)}`,{method:'POST', __timeout: 330000}); hideLoading(); d.error ? toast(d.error,'error') : (toast(`${n} parado`), render()); }

async function removeInst(n, status) {

  // v1.5 (U2): case-insensitive + pista visible cuando no coincide (antes: botón gris sin explicación)
  m.querySelector('#rm-confirm').oninput = e => {

  };
  btn.onclick = async () => {

    const d = await api(`/api/remove/${encodeURIComponent(n)}`, {method:'POST', __timeout: 330000});
    hideLoading();
    d.error ? toast(d.error, 'error') : (toast(`${n} eliminado`), render());
  };
}
setInterval(() => { if (!logActive && !document.querySelector('.modal-overlay') && !document.getElementById('loading')) render(); }, 5000);
