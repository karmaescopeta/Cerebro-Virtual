<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Cerebros</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
:root {
  /* Tokens de la web (tokens.css test4) — tema claro por defecto */
  --color-bg: #FAF8F4; --color-surface: #FFFFFF; --color-surface-container: #F2EEE7;
  --color-surface-high: #E9E4DB; --color-surface-highest: #DCD5C9;
  --color-border: #D8D2C6; --color-border-variant: #A8A093;
  --color-text-primary: #201D18; --color-text-secondary: #524D44; --color-text-tertiary: #6E6759;
  --color-primary: #1E6E52; --color-primary-container: #1E6E52; --color-on-primary: #FFFFFF;
  --color-primary-glow: rgba(30, 110, 82, 0.22);
  --color-success: #178253; --color-error: #B33A25; --color-error-container: #7A1F10;
  --shadow-card: 0 4px 16px -4px rgba(32, 29, 24, 0.12);
  --shadow-glow: 0 2px 8px rgba(32, 29, 24, 0.08);
  --font-display: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --radius-md: 16px; --radius-lg: 22px; --radius-full: 9999px;
  --transition-fast: 0.18s ease;
}
[data-theme="dark"] {
  /* Oscuro: mismo tema que fuerza el wizard */
  --color-bg: #070912; --color-surface: #0D101D; --color-surface-container: #121626;
  --color-surface-high: #1A1F33; --color-surface-highest: #232A44;
  --color-border: #2A3350; --color-border-variant: #475069;
  --color-text-primary: #EDF0F8; --color-text-secondary: #A9B1C6; --color-text-tertiary: #7C86A6;
  --color-primary: #38BDF8; --color-primary-container: #60A5FA; --color-on-primary: #082F49;
  --color-primary-glow: rgba(56, 189, 248, 0.3);
  --color-success: #34D399; --color-error: #F87171; --color-error-container: #7F1D1D;
  --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 24px rgba(56, 189, 248, 0.15);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: var(--font-body); background: radial-gradient(circle at 50% 0%, var(--color-surface-container) 0%, var(--color-bg) 70%); background-attachment: fixed; color: var(--color-text-primary); min-height:100vh; padding:32px; }
h1 { font-family: var(--font-display); font-size:28px; font-weight:700; } h2 { font-size:20px; font-weight:600; margin-bottom:16px; }
.material-symbols-outlined { font-family: 'Material Symbols Rounded'; font-feature-settings: 'liga'; -webkit-font-feature-settings: 'liga'; }
.subtitle { color: var(--color-text-tertiary); font-size:14px; margin-top:4px; }
.card { background: var(--color-surface); border:1px solid var(--color-border); border-radius: var(--radius-lg); padding:24px; box-shadow: var(--shadow-card); margin-bottom:24px; }
.btn { display:inline-flex; align-items:center; gap:8px; padding:10px 20px; border-radius: var(--radius-full); font-size:14px; font-weight:600; border:none; cursor:pointer; transition: var(--transition-fast); }
.btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
.btn-primary:hover { box-shadow: var(--shadow-glow); }
.btn-secondary { background: var(--color-surface-high); color: var(--color-text-primary); border:1px solid var(--color-border); }
.btn-secondary:hover { background: var(--color-surface-highest); }
.btn-danger { background: var(--color-error-container); color: var(--color-error); border:1px solid var(--color-error); }
.btn-danger:hover { opacity:0.85; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.btn .material-symbols-outlined { font-size:18px; }
.input { width:100%; padding:10px 14px; background: var(--color-surface-container); border:1px solid var(--color-border); border-radius: var(--radius-md); color: var(--color-text-primary); font-size:14px; outline:none; transition: var(--transition-fast); }
.input:focus { border-color: var(--color-primary); }
table { width:100%; border-collapse:collapse; }
th,td { text-align:left; padding:12px 16px; border-bottom:1px solid var(--color-border); }
th { color: var(--color-text-tertiary); font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.5px; }
td { font-size:14px; }
.mono-cell { font-family: var(--font-mono); font-size:12px; color: var(--color-text-secondary); white-space:nowrap; }
.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius: var(--radius-full); font-size:12px; font-weight:500; }
.badge .material-symbols-outlined { font-size:14px; }
.badge-running { background:color-mix(in srgb, var(--color-success) 15%, transparent); color: var(--color-success); }
.badge-stopped { background: var(--color-surface-high); color: var(--color-text-tertiary); }
.badge-ok { background:color-mix(in srgb, var(--color-success) 15%, transparent); color: var(--color-success); }
.badge-fail { background:color-mix(in srgb, var(--color-error) 15%, transparent); color: var(--color-error); }
.header { display:flex; justify-content:flex-end; align-items:center; position:relative; margin-bottom:32px; min-height:48px; }
.header h1 { position:absolute; left:50%; transform:translateX(-50%); margin:0; white-space:nowrap; }
.req-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:var(--space-5); }
.label-caps { font-family: var(--font-mono); font-size:10.5px; font-weight:500; letter-spacing:.14em; color: var(--color-text-tertiary); text-transform:uppercase; }
.req-item { background:color-mix(in srgb, var(--color-text-primary) 4%, transparent); border:1px solid var(--color-border); border-radius: var(--radius-md); padding:18px 20px; display:flex; flex-direction:column; gap:10px; }
.req-item .material-symbols-outlined { font-size:20px; color: var(--color-primary); }
.req-top { display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
.req-version { font-family: var(--font-mono); font-size:12px; color: var(--color-text-tertiary); }
.req-foot { display:flex; align-items:center; gap:10px; margin-top:auto; flex-wrap:wrap; }
.req-link { display:inline-flex; align-items:center; gap:4px; font-size:12px; color: var(--color-primary); text-decoration:none; }
.req-link .material-symbols-outlined { font-size:14px; }
.req-link:hover { text-decoration:underline; }
.modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:1000; }
.modal { background: var(--color-surface); border-radius: var(--radius-lg); padding:32px; max-width:500px; width:90%; box-shadow: var(--shadow-card); }
.modal h2 { margin-bottom:20px; } .modal-actions { display:flex; gap:12px; justify-content:flex-end; margin-top:24px; }
.toast { position:fixed; bottom:24px; right:24px; padding:12px 20px; border-radius: var(--radius-md); font-size:14px; font-weight:500; z-index:2000; animation:slideIn 0.3s ease; }
@keyframes slideIn { from{transform:translateX(100%);opacity:0;} to{transform:translateX(0);opacity:1;} }
.loading-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:3000; }
.loading-box { text-align:center; }
.loading-box p { margin-top:16px; color: var(--color-text-secondary); }
.spinner { width:20px; height:20px; border:2px solid var(--color-surface-high); border-top:2px solid var(--color-primary); border-radius:50%; animation:spin 0.8s linear infinite; display:inline-block; }
@keyframes spin { to{transform:rotate(360deg);} }
.empty-state { text-align:center; padding:40px; color: var(--color-text-tertiary); }
.empty-state .material-symbols-outlined { font-size:48px; opacity:0.3; margin-bottom:16px; }
.actions-cell { display:flex; gap:8px; justify-content:flex-end; }
th:last-child { text-align:right; }
.btn-sm { padding:6px 14px; font-size:12px; font-weight:500; }
.btn-sm .material-symbols-outlined { font-size:16px; }
.btn-icon { padding:6px 9px; }
.btn-icon-danger { background:color-mix(in srgb, var(--color-error) 12%, transparent); color: var(--color-error); border:1px solid color-mix(in srgb, var(--color-error) 35%, transparent); }
th { font-family: var(--font-mono); }
.log-panel { background: var(--color-bg); border:1px solid var(--color-border); border-radius: var(--radius-md); padding:16px; font-family: var(--font-mono); font-size:12px; max-height:240px; overflow-y:auto; white-space:pre-wrap; }
.toast-success { background:color-mix(in srgb, var(--color-success) 15%, transparent); color: var(--color-success); border:1px solid var(--color-success); }
.toast-error { background:color-mix(in srgb, var(--color-error) 15%, transparent); color: var(--color-error); border:1px solid var(--color-error); }
</style>
</head>
<body>
<div id="app"></div>
<script>
function toast(msg, type='success') {
  const el = document.createElement('div'); el.className = `toast toast-${type}`; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3000);
}
async function api(path, opts={}) {
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 120000);
  try { const res = await fetch(path, {...opts, signal: ctrl.signal}); clearTimeout(timer); return await res.json(); }
  catch(e) { clearTimeout(timer); return {error: e.name === 'AbortError' ? 'Timeout' : e.message}; }
}
function showLoading(text) {
  const el = document.createElement('div'); el.className = 'loading-overlay'; el.id = 'loading';
  el.innerHTML = `<div class="loading-box"><div class="spinner"></div><p>${text}</p></div>`;
  document.body.appendChild(el);
}
function hideLoading() { const el = document.getElementById('loading'); if (el) el.remove(); }

const REQ_ICONS = {"Docker":"hub","Docker corriendo":"sync","Git":"terminal","Python":"science","RAM (8GB)":"memory","Espacio disco (5GB)":"save","Espacio (1GB)":"save","Imágenes base":"cloud_upload"};
const reqCards = list => list.map(c => `<div class="req-item"><div class="req-top"><span class="material-symbols-outlined">${REQ_ICONS[c.name]||'info'}</span><span>${c.name}</span></div><div class="req-version">${c.version||(c.ok?'OK':'No encontrado')}</div><div class="req-foot">${c.ok?'<span class="badge badge-ok"><span class="material-symbols-outlined">check_circle</span>OK</span>':`<span class="badge badge-fail"><span class="material-symbols-outlined">warning</span>Faltante</span>${c.url?`<a class="req-link" href="${c.url}" target="_blank" rel="noreferrer"><span class="material-symbols-outlined">download</span>Descargar</a>`:''}`}</div></div>`).join('');
async function render() {
  const req = await api('/api/requirements');
  const inst = await api('/api/instances');
  const general = req.general || [], porCerebro = req.por_cerebro || [];
  const faltan = general.concat(porCerebro).filter(c => !c.ok).length;
  const dockerOk = (general.find(c => c.name === 'Docker corriendo') || {}).ok;
  const nInst = general.filter(c => ['Docker','Git','Python'].includes(c.name) && !c.ok).length;
  const chip = dockerOk && faltan === 0 ? '<span class="badge badge-ok"><span class="material-symbols-outlined">check_circle</span>Todo listo</span>' : `<span class="badge badge-fail"><span class="material-symbols-outlined">warning</span>Faltan ${faltan}</span>`;
  const imBase = porCerebro.find(c => c.name === 'Imágenes base');
  if (imBase) window.__imgBaseOk = imBase.ok;
  window.__isWin = req.is_win !== false;
  const projReady = req.project_ready !== false;

  document.getElementById('app').innerHTML = `
    <div class="header">
      <h1>Cerebro Virtual</h1>
      <button class="btn btn-primary" ${dockerOk && projReady ? '' : `disabled title="${dockerOk ? 'Descarga el proyecto primero' : 'Arranca Docker primero'}"`} onclick="showCreateModal()"><span class="material-symbols-outlined">add</span> Nuevo cerebro</button>
    </div>
    ${req.gestor_update ? `<div class="card" style="padding:16px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-color:var(--color-primary);">
      <span class="material-symbols-outlined" style="color:var(--color-primary);">update</span>
      <span style="flex:1;min-width:200px;">Hay una versión nueva del Gestor de Cerebros (${req.gestor_update.latest}). Descárgala y sustituye tu exe.</span>
      <a class="req-link" href="${req.gestor_update.url}" target="_blank" rel="noreferrer" style="font-size:13px;"><span class="material-symbols-outlined">download</span>Descargar nueva versión</a>
    </div>` : ''}
    ${!projReady ? `<div class="card" style="border-color:var(--color-primary);">
      <h2>Instalar Cerebro Virtual</h2>
      <p class="subtitle" style="margin-bottom:16px;">Haz clic, elige la carpeta destino (puede ser otro disco duro) y el proyecto queda instalado ahí en ~un minuto. Sistema, cerebros y vaults vivirán juntos en esa carpeta.</p>
      <button class="btn btn-primary" onclick="showLocationModal()"><span class="material-symbols-outlined">download</span>Descargar Cerebro Virtual</button>
    </div>` : ''}
    <div class="card">
      <h2 style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">Requisitos ${chip}${nInst ? '<button class="btn btn-secondary btn-sm" style="margin-left:auto;" onclick="installDeps()"><span class="material-symbols-outlined">download</span>Instalar dependencias</button>' : ''}${projReady && req.is_win && req.docker_data_here === false ? '<button class="btn btn-secondary btn-sm" onclick="confirmDockerMove()"><span class="material-symbols-outlined">save</span>Mover datos de Docker aquí</button>' : ''}</h2>
      ${dockerOk ? '' : '<p class="subtitle" style="margin-bottom:14px;">Arranca Docker Desktop y espera a que la ballena esté verde — la página se refresca sola cada 5 segundos.</p>'}
      <div class="req-grid">${reqCards(general)}</div>
      <p class="label-caps" style="margin:20px 0 12px;">Por cerebro</p>
      <div class="req-grid">${reqCards(porCerebro)}</div>
    </div>
    <div class="card">
      <h2>Tus cerebros (${(inst.instances||[]).length}) ${projReady ? `<span class="req-version" style="font-weight:400;">— sistema en ${req.base}</span>` : ''}</h2>
      ${(inst.instances||[]).length ? `<table><thead><tr><th>Nombre</th><th>Frontend</th><th>Backend</th><th>Agente</th><th>Estado</th><th>Recursos</th><th>Acciones</th></tr></thead><tbody>
        ${(inst.instances||[]).map(i => `<tr><td style="font-weight:600;color:var(--color-primary);">${i.name}</td><td style="font-family:var(--font-mono);font-size:13px;">${i.ports.FRONTEND_PORT||'-'}</td><td style="font-family:var(--font-mono);font-size:13px;">${i.ports.BACKEND_PORT||'-'}</td><td style="font-family:var(--font-mono);font-size:13px;">${i.ports.AGENT_PORT||'-'}</td><td><span class="badge badge-${i.status==='running'?'running':'stopped'}">${i.status==='running'?'Activo':'Parado'}</span></td><td class="mono-cell">${[i.stats, i.size_gb].filter(Boolean).join(' · ')||'—'}</td><td class="actions-cell">${i.status==='running'?`<button class="btn btn-primary btn-sm" onclick="openInst('${i.name}', ${i.ports.FRONTEND_PORT||5173})"><span class="material-symbols-outlined">public</span>Abrir</button><button class="btn btn-secondary btn-sm" onclick="stopInst('${i.name}')">Parar</button>`:`<button class="btn btn-primary btn-sm" ${dockerOk?'':'disabled title="Arranca Docker primero"'} onclick="startInst('${i.name}')"><span class="material-symbols-outlined">electric_bolt</span>Iniciar</button>`}<button class="btn btn-secondary btn-sm btn-icon" title="Descargar vault" onclick="downloadInst('${i.name}')"><span class="material-symbols-outlined">download</span></button><button class="btn btn-sm btn-icon btn-icon-danger" title="Borrar" onclick="removeInst('${i.name}')"><span class="material-symbols-outlined">delete</span></button></td></tr>`).join('')}
      </tbody></table>` : `<div class="empty-state"><span class="material-symbols-outlined">psychology</span><p>Aún no hay cerebros.</p><p style="margin-top:8px;font-size:13px;">Crea tu primer Cerebro con el botón de arriba.</p></div>`}
    </div>
  `;
  if (!projReady && !locAsked && !document.querySelector('.modal-overlay')) { locAsked = true; showLocationModal(); }
}

function showCreateModal() {
  const m = document.createElement('div'); m.className = 'modal-overlay';
  m.innerHTML = `<div class="modal"><h2>Crear nuevo cerebro</h2><p class="subtitle" style="margin-bottom:20px;">Elige un nombre. Solo letras, números, guiones y guiones bajos.</p><input class="input" id="new-name" placeholder="ej: cerebro2" pattern="[A-Za-z0-9_-]+" autofocus><div class="modal-actions"><button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancelar</button><button class="btn btn-primary" id="create-btn">Crear</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#create-btn').onclick = async () => {
    const name = m.querySelector('#new-name').value.trim();
    if (!name) { toast('Nombre vacío', 'error'); return; }
    if (!/^[A-Za-z0-9_-]+$/.test(name)) { toast('Solo letras, números, guiones y guiones bajos', 'error'); return; }
    m.remove(); showLoading('Creando instancia...');
    const d = await api('/api/create', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
    hideLoading();
    if (d.error) { toast(d.error, 'error'); return; }
    toast(`${name} creado`); render();
  };
  m.querySelector('#new-name').onkeydown = e => { if (e.key==='Enter') m.querySelector('#create-btn').click(); };
}

let logActive = false;
async function startInst(n) {
  const d = await api(`/api/start/${encodeURIComponent(n)}`, {method:'POST'});
  if (d.error) { toast(d.error, 'error'); return; }
  showLog(n);
}
let locAsked = false, dockerMoveRoot = null;
function showLocationModal() {
  const m = document.createElement('div'); m.className = 'modal-overlay';
  const isWin = window.__isWin;
  m.innerHTML = `<div class="modal"><h2>¿Dónde está tu Cerebro Virtual?</h2><p class="subtitle" style="margin-bottom:20px;">Todo vivirá en esta carpeta: el sistema, una carpeta por cerebro con su vault${isWin ? ' y (opcional) los datos de Docker con el peso de las imágenes' : ''}. Si ya lo tenías instalado con un gestor anterior, apunta a su carpeta y recuperarás tus cerebros.</p><input class="input" id="inst-dir" placeholder="ej: D:\\Gestor de Cerebros" autofocus>${isWin ? '<label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--color-text-secondary);"><input type="checkbox" id="dd-move"> Mover también los datos de Docker (imágenes/contenedores) a esta carpeta</label>' : ''}<div class="modal-actions"><button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Ahora no</button><button class="btn btn-secondary" id="sb-btn">Ya está instalado aquí</button><button class="btn btn-primary" id="dl-btn"><span class="material-symbols-outlined">download</span>Instalar aquí</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#sb-btn').onclick = async () => {
    const d = await api('/api/set-base', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path:m.querySelector('#inst-dir').value.trim()})});
    if (d.error) { toast(d.error, 'error'); return; }
    m.remove(); toast(`Sistema encontrado — ${d.instances} cerebro(s)`); render();
  };
  m.querySelector('#dl-btn').onclick = async () => {
    const dest = m.querySelector('#inst-dir').value.trim();
    if (isWin && m.querySelector('#dd-move') && m.querySelector('#dd-move').checked) dockerMoveRoot = dest;
    m.remove();
    const d = await api('/api/download-project', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({dest})});
    if (d.error) { toast(d.error, 'error'); return; }
    showLog('setup');
  };
  m.querySelector('#inst-dir').onkeydown = e => { if (e.key==='Enter') m.querySelector('#dl-btn').click(); };
}
async function startDockerMove(root) {
  const d = await api('/api/move-docker-data', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({dest:root})});
  if (d.error) { toast(d.error, 'error'); return; }
  showLog('dockermove');
}
function confirmDockerMove() {
  const m = document.createElement('div'); m.className = 'modal-overlay';
  m.innerHTML = `<div class="modal"><h2>Mover los datos de Docker</h2><p class="subtitle" style="margin-bottom:16px;">Docker Desktop se apagará (tus cerebros se paran) y su disco de imágenes/contenedores se moverá a la carpeta del sistema. Con muchos GB puede tardar bastante. ¿Seguro?</p><div class="modal-actions"><button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancelar</button><button class="btn btn-primary" id="ddgo">Mover</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#ddgo').onclick = () => { m.remove(); startDockerMove(''); };
}
async function installDeps() {
  const d = await api('/api/install-deps', {method:'POST'});
  if (d.error) { toast(d.error, 'error'); return; }
  showLog('deps');
}
function showLog(n) {
  logActive = true;
  let box = document.getElementById('logbox');
  if (!box) {
    box = document.createElement('div'); box.className = 'card'; box.id = 'logbox';
    document.getElementById('app').appendChild(box);
  }
  box.innerHTML = `<h2>${n === 'setup' ? 'Descargando Cerebro Virtual' : n === 'deps' ? 'Instalando dependencias' : n === 'dockermove' ? 'Moviendo datos de Docker' : 'Iniciando ' + n}</h2>${n !== 'setup' && window.__imgBaseOk === false ? '<p class="subtitle" style="margin-bottom:12px;">Primera vez: se descargan las imágenes (~3GB) y puede tardar varios minutos. No cierres esta página.</p>' : ''}<div class="log-panel" id="loglines"></div>`;
  const poll = async () => {
    const d = await api(`/api/logs/${encodeURIComponent(n)}`);
    const el = document.getElementById('loglines');
    if (!el) { logActive = false; return; }
    el.textContent = (d.lines || []).join('\n');
    el.scrollTop = el.scrollHeight;
    if (d.done) {
      logActive = false;
      if (n === 'setup') {
        toast(d.ok ? 'Proyecto descargado — ya puedes crear cerebros' : 'Error al descargar el proyecto', d.ok ? 'success' : 'error');
        if (d.ok && dockerMoveRoot) { const root = dockerMoveRoot; dockerMoveRoot = null; startDockerMove(root); return; }
      }
      else if (n === 'deps') toast(d.ok ? 'Dependencias listas' : 'Algunas dependencias fallaron — mira el log', d.ok ? 'success' : 'error');
      else if (n === 'dockermove') toast(d.ok ? 'Datos de Docker movidos' : 'Error moviendo los datos de Docker — mira el log', d.ok ? 'success' : 'error');
      else d.ok ? toast(`${n} iniciado`) : toast(`Error al iniciar ${n}`, 'error');
      render();
      return;
    }
    setTimeout(poll, 1500);
  };
  poll();
}
async function stopInst(n) { showLoading(`Parando ${n}...`); const d = await api(`/api/stop/${encodeURIComponent(n)}`,{method:'POST'}); hideLoading(); d.error ? toast(d.error,'error') : (toast(`${n} parado`), render()); }
function openInst(n, port) { window.open(`http://localhost:${port}`); }
function downloadInst(n) { window.location.href = `/api/download/${encodeURIComponent(n)}`; }
function removeInst(n) {
  const m = document.createElement('div'); m.className = 'modal-overlay';
  m.innerHTML = `<div class="modal"><h2>Borrar ${n}</h2><p class="subtitle" style="margin-bottom:16px;">Se borra TODO, incluido el vault. Si quieres conservarlo, descárgalo antes — es opcional: <a href="#" onclick="event.preventDefault();downloadInst('${n}');">Descargar vault</a></p><input class="input" id="rm-confirm" placeholder="Escribe ${n} para confirmar" autofocus><div class="modal-actions"><button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancelar</button><button class="btn btn-danger" id="rm-btn" disabled>Borrar</button></div></div>`;
  document.body.appendChild(m);
  const btn = m.querySelector('#rm-btn');
  m.querySelector('#rm-confirm').oninput = e => { btn.disabled = e.target.value !== n; };
  btn.onclick = async () => {
    m.remove(); showLoading(`Eliminando ${n}...`);
    const d = await api(`/api/remove/${encodeURIComponent(n)}`, {method:'POST'});
    hideLoading();
    d.error ? toast(d.error, 'error') : (toast(`${n} eliminado`), render());
  };
}
setInterval(() => { if (!logActive && !document.querySelector('.modal-overlay') && !document.getElementById('loading')) render(); }, 5000);

render();
</script>
